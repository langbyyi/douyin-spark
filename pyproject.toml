[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dyspark"
version = "0.1.0"
description = "Daily one-shot Douyin chat streak keeper (scheduled, headed browser, desktop GUI, MCP server)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "playwright>=1.48,<2",
    "python-dotenv>=1.0,<2",
    "segno>=1.5,<2",  # terminal QR of the web login link
    "tomlkit>=0.12,<1",  # CLI --save and GUI/MCP friend editing
    "tzdata>=2024.1",  # fallback when the OS timezone database is absent
]

[project.optional-dependencies]
# `spark mcp`: MCP server for AI clients (Grok CLI, Claude Code, Cursor, ...)
mcp = ["mcp>=2.3,<3"]
# `spark gui`: local web control panel (Windows / macOS / Linux desktop)
gui = ["starlette>=0.37,<2", "uvicorn>=0.30,<1", "httpx[socks]>=0.27,<1"]
dev = ["pytest>=8,<10", "ruff>=0.6", "httpx>=0.27,<1", "mcp>=2.3,<3", "starlette>=0.37,<2", "uvicorn>=0.30,<1"]

[project.scripts]
spark = "dyspark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.setuptools.package-data]
dyspark = ["gui_static/*", "managed_node.cjs"]
